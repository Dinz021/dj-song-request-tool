<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Event Helper | Request Box</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen font-sans">

    <header class="bg-zinc-900 py-6 text-center border-b border-yellow-500">
        <h1 class="text-3xl font-extrabold text-yellow-500 tracking-widest">DJ PRO HELPER 🎧</h1>
        <p class="text-gray-400 text-sm mt-1">Submit your requests or check BPM</p>
    </header>

    <div class="max-w-md mx-auto p-6 space-y-8">
        
        <section class="bg-zinc-800 p-6 rounded-xl border border-zinc-700 shadow-xl">
            <h2 class="text-xl font-bold mb-4 flex items-center">🎵 Song Request</h2>
            <div class="space-y-3">
                <input type="text" id="songName" placeholder="Song Name / Artist" class="w-full p-3 rounded bg-zinc-700 border-none text-white focus:ring-2 focus:ring-yellow-500">
                <button onclick="sendRequest()" class="w-full bg-yellow-500 text-black font-bold py-3 rounded hover:bg-yellow-400 transition">Submit Request</button>
            </div>
            <p id="msg" class="text-green-400 text-sm mt-3 hidden text-center">Request sent to DJ! ✅</p>
        </section>

        <section class="bg-zinc-800 p-6 rounded-xl border border-zinc-700 shadow-xl text-center">
            <h2 class="text-xl font-bold mb-4">🥁 BPM Tapper</h2>
            <p class="text-gray-400 text-sm mb-4">Tap the button to the beat of the music</p>
            <div id="bpmDisplay" class="text-5xl font-black text-yellow-500 mb-4">0</div>
            <button onclick="tapBPM()" class="w-32 h-32 rounded-full bg-zinc-700 border-4 border-yellow-500 text-white font-bold text-lg hover:bg-zinc-600 active:scale-95 transition mx-auto flex items-center justify-center">TAP</button>
            <button onclick="resetBPM()" class="block mt-4 text-xs text-gray-500 underline mx-auto">Reset</button>
        </section>

    </div>

    <script>
        // Request logic
        function sendRequest() {
            const song = document.getElementById('songName').value;
            if(song) {
                document.getElementById('msg').classList.remove('hidden');
                document.getElementById('songName').value = "";
                setTimeout(() => { document.getElementById('msg').classList.add('hidden'); }, 3000);
            }
        }

        // BPM Tapper logic
        let taps = [];
        function tapBPM() {
            const now = Date.now();
            taps.push(now);
            if (taps.length > 1) {
                const intervals = [];
                for (let i = 1; i < taps.length; i++) {
                    intervals.push(taps[i] - taps[i - 1]);
                }
                const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
                const bpm = Math.round(60000 / avgInterval);
                document.getElementById('bpmDisplay').innerText = bpm;
            }
            if (taps.length > 10) taps.shift(); // Keep only last 10 taps for accuracy
        }

        function resetBPM() {
            taps = [];
            document.getElementById('bpmDisplay').innerText = "0";
        }
    </script>
</body>
</html>
