<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ PRO | Event Helper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen font-sans">

    <header class="bg-zinc-900 py-8 text-center border-b border-yellow-500 shadow-lg">
        <h1 class="text-4xl font-extrabold text-yellow-500 tracking-widest uppercase">DJ PRO HELPER 🎧</h1>
        <p class="text-gray-400 text-sm mt-2 font-medium tracking-wide">Instant Song Requests & BPM Tool</p>
    </header>

    <div class="max-w-md mx-auto p-6 space-y-10">
        <section class="bg-zinc-800 p-6 rounded-2xl border border-zinc-700 shadow-2xl">
            <h2 class="text-xl font-bold mb-5 flex items-center text-yellow-500">
                <span class="mr-2 underline">🎵</span> Request a Song
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1 ml-1 font-semibold uppercase">Song Name & Artist</label>
                    <input type="text" id="songInput" placeholder="e.g. Shape of You - Ed Sheeran" required 
                           class="w-full p-4 rounded-xl bg-zinc-900 border border-zinc-700 text-white focus:ring-2 focus:ring-yellow-500 outline-none transition duration-300">
                </div>
                
                <div>
                    <label class="block text-xs text-gray-400 mb-1 ml-1 font-semibold uppercase">Your Name (Optional)</label>
                    <input type="text" id="nameInput" placeholder="Your name" 
                           class="w-full p-4 rounded-xl bg-zinc-900 border border-zinc-700 text-white focus:ring-2 focus:ring-yellow-500 outline-none transition duration-300">
                </div>

                <button onclick="sendTelegramRequest()" id="sendBtn" class="w-full bg-yellow-500 text-black font-black py-4 rounded-xl hover:bg-yellow-400 active:scale-95 transition-all shadow-lg text-lg uppercase">
                    SEND REQUEST
                </button>
                <p id="statusMsg" class="text-center text-xs mt-2"></p>
            </div>
        </section>
    </div>

    <script>
        async function sendTelegramRequest() {
            const songData = document.getElementById('songInput').value;
            const requester = document.getElementById('nameInput').value || "Anonymous";
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('statusMsg');

            if(!songData) {
                alert("Please enter a song name!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "SENDING...";

            try {
                // අපේ Vercel Backend එකට විස්තර යවනවා
                const response = await fetch('https://dj-teezar-api.vercel.app/send-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        artistName: requester,
                        songName: songData,
                        message: "Requested via Web Tool"
                    })
                });

                const result = await response.json();

                if (result.success) {
                    status.style.color = "#eab308";
                    status.innerText = "✅ Request sent to Telegram!";
                    document.getElementById('songInput').value = "";
                } else {
                    status.style.color = "#ff4444";
                    status.innerText = "❌ Error: Server issue. Check Vercel.";
                }
            } catch (error) {
                status.style.color = "#ff4444";
                status.innerText = "❌ Connection failed!";
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = "SEND REQUEST";
            }
        }
    </script>
</body>
</html>
